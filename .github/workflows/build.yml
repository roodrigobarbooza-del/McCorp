name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # paper-api 26.x viene compilado para Java 25
          java-version: '25'
          cache: maven
      - name: Compilar plugins
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: '*/target/*.jar'

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # para publicar el resource pack en el release "resourcepack"
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # paper-api 26.x viene compilado para Java 25
          java-version: '25'
          cache: maven
      - name: Revisar resource pack
        run: python3 tools/validar-pack.py
      - name: Compilar plugins
        run: mvn -B package
      - name: Empaquetar resource pack
        run: python3 tools/empaquetar-pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: '*/target/*.jar'
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack
          path: |
            build/mccorp-pack.zip
            build/mccorp-pack.zip.sha1
      # Cada push a main deja el pack en un link fijo que MinerCorp-Pack usa en
      # modo url: no hace falta abrir puertos ni subirlo a mano.
      - name: Publicar resource pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view resourcepack >/dev/null 2>&1 || gh release create resourcepack \
            --target main --latest=false --title "Resource pack" \
            --notes "Lo actualiza el CI en cada push a main. Link fijo: https://github.com/${{ github.repository }}/releases/download/resourcepack/mccorp-pack.zip"
          gh release upload resourcepack build/mccorp-pack.zip build/mccorp-pack.zip.sha1 --clobber

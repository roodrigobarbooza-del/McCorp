name: MinerCorp-Mining
version: '${project.version}'
main: com.isjbar.minercorp.mining.MiningPlugin
api-version: '26.3'
author: isjbar
description: Nucleo del trabajo de mineria - empresas, taladros, minions y venta de carbon. Requiere MinerCorp-Territory y MinerCorp-Economy.
depend: [MinerCorp-Territory, MinerCorp-Economy]
# Recursos es opcional: con el se saca el carbon crudo como items para el Horno de coque.
softdepend: [MinerCorp-Recursos]

commands:
  empresa:
    description: Comando principal de MinerCorp
    usage: /empresa <subcomando>
    aliases: [mc, empresamina]

permissions:
  minercorp.use:
    description: Permite usar los comandos basicos de MinerCorp
    default: true
  minercorp.admin:
    description: Permite administrar MinerCorp (dar dinero, resetear empresas, etc)
    default: op

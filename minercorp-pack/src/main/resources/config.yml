# ============================================
#  MinerCorp-Pack - configuracion
# ============================================
#
# El resource pack de McCorp le da modelo e imagen propios a vehiculos,
# maquinas e items (bidon de gasolina, coque...). Este plugin se lo manda a
# cada jugador cuando entra.
#
# modo:
#   url     -> (recomendado) los jugadores bajan el pack de "url.direccion".
#              Por defecto es el link que GitHub Actions actualiza solo en cada
#              cambio de main, asi que no hay que abrir puertos ni subir nada.
#              Funciona tambien entrando por tuneles (SquidServers, playit...).
#              Si "url.sha1" esta vacio, el plugin baja el zip al arrancar y
#              lo calcula solo.
#   propio  -> el plugin sirve el pack que trae adentro con un mini servidor
#              web en "propio.puerto". Solo sirve si los jugadores llegan a ese
#              puerto: misma PC, red de casa, o el puerto abierto en el router.
#              NO pasa por tuneles como SquidServers.
#   apagado -> no se manda pack y los items se ven como items vanilla.
modo: url

# true: quien rechaza el pack no puede entrar (asi nadie ve cubos violetas).
obligatorio: true
mensaje: "McCorp usa texturas propias para vehiculos, maquinas e items."

propio:
  puerto: 8164
  # Vacio = se usa la misma direccion con la que el jugador entro al server
  # (localhost, IP de la red de casa o tu dominio), que suele ser lo correcto.
  # Ponela solo si eso falla, por ejemplo "mi-server.duckdns.org".
  direccion-publica: ""
  # Vacio = el pack que viene adentro del jar. Si queres probar texturas sin
  # recompilar, pone aca el nombre de un .zip dentro de plugins/MinerCorp-Pack/.
  archivo: ""

url:
  direccion: "https://github.com/roodrigobarbooza-del/McCorp/releases/download/resourcepack/mccorp-pack.zip"
  sha1: ""

# No tocar: sirve para actualizar configs viejos solo.
config-version: 2

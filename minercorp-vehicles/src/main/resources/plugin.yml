name: MinerCorp-Vehicles
version: '${project.version}'
main: com.isjbar.minercorp.vehicles.VehiclesPlugin
api-version: '26.3'
author: isjbar
description: Vehiculos de MinerCorp - taladros, camiones y camionetas con garaje, combustible y carga. Requiere MinerCorp-Territory, MinerCorp-Economy y MinerCorp-Mining.
depend: [MinerCorp-Territory, MinerCorp-Economy, MinerCorp-Mining]
# Con MinerCorp-Pack, los vehiculos se dibujan con los modelos 3D del resource pack.
softdepend: [MinerCorp-GranSede, MinerCorp-Recursos, MinerCorp-Pack]

commands:
  vehiculo:
    description: Vehiculos de MinerCorp
    usage: /vehiculo <garaje|tienda|guardar|cargar|limpiar|dar>
    aliases: [vehiculos, veh]
  garaje:
    description: Abre el garaje con tus vehiculos y los de tu empresa
    usage: /garaje

permissions:
  minercorp.vehiculos.use:
    description: Permite usar vehiculos y el garaje
    default: true
  minercorp.vehiculos.admin:
    description: Permite dar vehiculos y limpiar restos
    default: op
